<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathsAI - Asistente de Voz</title>
    <link rel="stylesheet" href="css/voice-assistant.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="mobile-container">
        <!-- Conversation Area -->
        <div class="conversation-area">
            <div class="message assistant-message" id="assistantMessage">
                Hola, soy tu asistente. ¿A dónde quieres ir hoy?
            </div>
        </div>

        <!-- Voice Visualizer -->
        <div class="voice-visualizer">
            <div class="voice-circle" id="voiceCircle">
                <div class="inner-circle"></div>
            </div>
            <div class="listening-text" id="listeningText">Escuchando...</div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="control-btn close-btn" onclick="closeAssistant()">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>

            <button class="control-btn mic-btn active" id="micBtn" onclick="toggleMic()">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 1C10.34 1 9 2.34 9 4V12C9 13.66 10.34 15 12 15C13.66 15 15 13.66 15 12V4C15 2.34 13.66 1 12 1Z" fill="currentColor"/>
                    <path d="M19 10V12C19 15.87 15.87 19 12 19C8.13 19 5 15.87 5 12V10M12 19V23M8 23H16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
    </div>

    <script src="js/voice-assistant.js"></script>
</body>
</html>
